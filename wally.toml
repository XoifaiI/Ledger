[package]
name = "xoifaii/ledger"
version = "4.5.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
license = "MIT"
authors = ["XoifaiI"]
description = "Lock-free event-sourced player data for Roblox. State is a fold over validated ops, no session locks."
exclude = [
    "Ledger.rbxm",
    "docs",
    "docs/**",
    "tests",
    "tests/**",
    "zune",
    "zune/**",
    "dev",
    "dev/**",
    "spec",
    "spec/**",
    "examples",
    "examples/**",
    "internal",
    "internal/**",
    "test.project.json",
    "RunTests.server.luau",
    "sourcemap.json",
    ".vscode",
    ".vscode/**",
    "**/.git/**",
    "node_modules",
    "node_modules/**",
    "types",
    "types/**",
    "package.json",
    "package-lock.json",
    "tsconfig.json",
    "rokit.toml",
    "stylua.toml",
    "analyze.ps1",
]
