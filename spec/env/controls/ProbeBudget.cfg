\* Request budgets under Budgets: every send spends from its server's budget, a tick refills by any
\* amount, Heal lifts every budget to the floor, other code spends a budget at no fault, and a
\* restart gives a fresh budget. UpdateAsync, GetAsync, RemoveAsync and listing pages are driven,
\* with FailBefore and crashes. 1 server, 1 key, 2 calls with argument 1, 1 tick, no skew, at most
\* 1 fault, no bound on lag or delay, budgets from 0 to 1 and a floor of 1 once calm. MemoryStore
\* is off: ProbeMemory.cfg drives it. Stamps, reverts, cuts and stale reads are off: the other
\* Probe configs drive them.
CONSTANTS
    Servers = {s1}
    Keys = {k1}
    MKeys = {m1}
    MaxReqs = 2
    MaxMsReqs = 0
    MaxTime = 1
    MaxSkew = 0
    MaxFaults = 1
    FailBefore = TRUE
    LoseAnswer = FALSE
    LoseCommit = FALSE
    LateLand = FALSE
    DsSplit = FALSE
    DsOutage = FALSE
    Reverts = FALSE
    Crashes = TRUE
    Shutdowns = FALSE
    ClockJumps = FALSE
    ClockSteps = FALSE
    MsFail = FALSE
    MsMaybe = FALSE
    MsVanish = FALSE
    MsOutage = FALSE
    MsSplit = FALSE
    StaleGet = FALSE
    StaleRun = FALSE
    StaleList = FALSE
    MsStale = FALSE
    RunAfterAnswer = FALSE
    KeyInfo = FALSE
    MsOn = FALSE
    LagAfterCalm = 2
    DelayAfterCalm = 2
    SkewAfterCalm = 0
    MsEvict = FALSE
    Budgets = TRUE
    MaxBudget = 1
    BudgetAfterCalm = 1
    LifeAfterCalm = 0
    MaxExpiry = 9
    Args = {1}
    Lists = {FALSE}
    Again = FALSE
    Ttls = {1}
    Gets = TRUE
    Listers = {s1}
INIT Init
NEXT Next
INVARIANT EnvHolds
CHECK_DEADLOCK FALSE
