\* MemoryStore up with MsFail, MsStale and RunAfterAnswer on. MsMaybe and every other fault off.
\* All three fixes in. Clocks are exact here, so the margin is 0: LeaseSureStep checks clock steps.
\* 2 servers, 1 MemoryStore key, 4 MemoryStore calls, 1 tick, no skew, a lease lives 1 tick,
\* 2 rounds each, at most 1 fault, no bound on lag or delay.
CONSTANTS
    Servers = {s1, s2}
    Keys = {k1}
    MKeys = {m1}
    MaxReqs = 0
    MaxMsReqs = 4
    MaxTime = 1
    MaxSkew = 0
    MaxFaults = 1
    FailBefore = FALSE
    LoseAnswer = FALSE
    LoseCommit = FALSE
    LateLand = FALSE
    DsSplit = FALSE
    DsOutage = FALSE
    Reverts = FALSE
    Crashes = FALSE
    Shutdowns = FALSE
    ClockJumps = FALSE
    ClockSteps = FALSE
    MsFail = TRUE
    MsMaybe = FALSE
    MsVanish = FALSE
    MsOutage = FALSE
    MsSplit = FALSE
    StaleGet = FALSE
    StaleRun = FALSE
    StaleList = FALSE
    MsStale = TRUE
    RunAfterAnswer = TRUE
    KeyInfo = FALSE
    MsOn = TRUE
    LagAfterCalm = 2
    DelayAfterCalm = 2
    SkewAfterCalm = 0
    MsEvict = FALSE
    Budgets = FALSE
    MaxBudget = 1
    BudgetAfterCalm = 0
    LifeAfterCalm = 0
    MaxExpiry = 9
    Ttl = 1
    Rounds = 2
    Margin = 0
    FromAnswer = FALSE
    SafeRelease = TRUE
INIT Init
NEXT Next
INVARIANT Exclusive
INVARIANT EndsAfterAnswer
CHECK_DEADLOCK FALSE
