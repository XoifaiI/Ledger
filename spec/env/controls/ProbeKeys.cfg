\* Listing by one server of two, with and without excludeDeleted, each page a call in steps, cuts of
\* one server and of all,
\* and notes, with FailBefore, StaleGet and StaleList on.
\* 2 servers, 1 key, 2 calls with arguments 1 and 2, no ticks, no skew, at most 2 faults, no bound
\* on lag or delay. No GetAsync: ProbeStore.cfg and ProbeStamps.cfg drive it. Stamps and reverts are
\* off here: ProbeStamps.cfg drives them. LoseAnswer, LoseCommit, LateLand, StaleRun, RunAfterAnswer
\* and crashes are off: ProbeStore.cfg drives them. MemoryStore is off.
CONSTANTS
    Servers = {s1, s2}
    Keys = {k1}
    MKeys = {m1}
    MaxReqs = 2
    MaxMsReqs = 0
    MaxTime = 0
    MaxSkew = 0
    MaxFaults = 2
    FailBefore = TRUE
    LoseAnswer = FALSE
    LoseCommit = FALSE
    LateLand = FALSE
    DsSplit = TRUE
    DsOutage = TRUE
    Reverts = FALSE
    Crashes = FALSE
    Shutdowns = FALSE
    ClockJumps = FALSE
    ClockSteps = FALSE
    MsFail = FALSE
    MsMaybe = FALSE
    MsVanish = FALSE
    MsOutage = FALSE
    MsSplit = FALSE
    StaleGet = TRUE
    StaleRun = FALSE
    StaleList = TRUE
    MsStale = FALSE
    RunAfterAnswer = FALSE
    KeyInfo = FALSE
    MsOn = FALSE
    LagAfterCalm = 1
    DelayAfterCalm = 1
    SkewAfterCalm = 0
    MsEvict = FALSE
    Budgets = FALSE
    MaxBudget = 1
    BudgetAfterCalm = 0
    LifeAfterCalm = 0
    MaxExpiry = 9
    Args = {1, 2}
    Lists = {FALSE, TRUE}
    Again = FALSE
    Ttls = {1}
    Gets = FALSE
    Listers = {s1}
INIT Init
NEXT Next
INVARIANT EnvHolds
CHECK_DEADLOCK FALSE
