    MsMaybe = FALSE
    MsVanish = FALSE
    MsOutage = FALSE
    MsSplit = FALSE
    StaleGet = TRUE
    StaleRun = TRUE
    StaleList = FALSE
    MsStale = FALSE
    RunAfterAnswer = TRUE
    KeyInfo = FALSE
    MsOn = FALSE
    LagAfterCalm = 1
    DelayAfterCalm = 1
