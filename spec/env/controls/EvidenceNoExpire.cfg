    Servers = {s1, s2}
    Keys = {k1}
    MKeys = {m1}
    MaxReqs = 0
    MaxMsReqs = 2
    MaxTime = 2
    MaxSkew = 0
    MaxFaults = 0
    FailBefore = FALSE
    LoseAnswer = FALSE
    LoseCommit = FALSE
    LateLand = FALSE
    DsSplit = FALSE
    DsOutage = FALSE
    Reverts = FALSE
    Crashes = FALSE
    Shutdowns = FALSE
    ClockJumps = FALSE
    ClockSteps = FALSE
    MsFail = FALSE
    MsMaybe = FALSE
    MsVanish = FALSE
    MsOutage = FALSE
    MsSplit = FALSE
    StaleGet = FALSE
    StaleRun = FALSE
    StaleList = FALSE
    MsStale = TRUE
    RunAfterAnswer = FALSE
    KeyInfo = FALSE
    MsOn = TRUE
    LagAfterCalm = 3
    DelayAfterCalm = 3
    SkewAfterCalm = 0
    MsEvict = FALSE
    Budgets = FALSE
    MaxBudget = 1
    BudgetAfterCalm = 0
    LifeAfterCalm = 0
    MaxExpiry = 9
    Ttl = 3
    Writer = s1
