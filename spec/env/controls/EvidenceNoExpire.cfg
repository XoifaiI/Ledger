\* MemoryStore up with MsStale on and every fault off, no bound on lag. The fix is in. The writer keeps
\* its lease, and it lives past the model's time. 2 servers, 1 MemoryStore key, 2 MemoryStore calls, 2 ticks,
\* a lease lives 3 ticks, no fault.
