\* The erase is an UpdateAsync that writes a tombstone when it reads 1. FailBefore, LoseAnswer,
\* LoseCommit, LateLand, StaleGet, StaleRun and RunAfterAnswer on.
\* 2 servers, 1 key, 4 calls, no ticks, no skew, at most 1 fault, no bound on lag or delay.
CONSTANTS
    Servers = {w1, e1}
    Keys = {k1}
    MKeys = {m1}
    MaxReqs = 4
    MaxMsReqs = 0
    MaxTime = 0
    MaxSkew = 0
    MaxFaults = 1
    FailBefore = TRUE
    LoseAnswer = TRUE
    LoseCommit = TRUE
    LateLand = TRUE
    DsSplit = FALSE
    DsOutage = FALSE
    Reverts = FALSE
    Crashes = FALSE
    Shutdowns = FALSE
    ClockJumps = FALSE
    ClockSteps = FALSE
    MsFail = FALSE
    MsMaybe = FALSE
    MsVanish = FALSE
    MsOutage = FALSE
    MsSplit = FALSE
    StaleGet = TRUE
    StaleRun = TRUE
    StaleList = FALSE
    MsStale = FALSE
    RunAfterAnswer = TRUE
    KeyInfo = FALSE
    MsOn = FALSE
    LagAfterCalm = 1
    DelayAfterCalm = 1
    SkewAfterCalm = 0
    MsEvict = FALSE
    Budgets = FALSE
    MaxBudget = 1
    BudgetAfterCalm = 0
    LifeAfterCalm = 0
    MaxExpiry = 9
    Mode = "tomb"
    Wr = w1
    Er = e1
INIT Init
NEXT Next
INVARIANT NeverErased
CHECK_DEADLOCK FALSE
