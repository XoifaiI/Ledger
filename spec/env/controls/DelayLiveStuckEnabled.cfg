\* The same model as DelayLiveStuck, with Hold written as ENABLED of the second send. Hold turns FALSE
\* when MaxReqs disables that send, so time moves on and ChainInTime reports the chain unfinished.
\* 1 server, 1 key, 1 call, 3 ticks, no skew, no fault, no bound on lag. Weak fairness, no symmetry.
CONSTANTS
    Servers = {s1}
    Keys = {k1}
    MKeys = {m1}
    MaxReqs = 1
    MaxMsReqs = 0
    MaxTime = 3
    MaxSkew = 0
    MaxFaults = 0
    FailBefore = FALSE
    LoseAnswer = FALSE
    LoseCommit = FALSE
    LateLand = FALSE
    DsSplit = FALSE
    DsOutage = FALSE
    Reverts = FALSE
    Crashes = FALSE
    Shutdowns = FALSE
    ClockJumps = FALSE
    ClockSteps = FALSE
    MsFail = FALSE
    MsMaybe = FALSE
    MsVanish = FALSE
    MsOutage = FALSE
    MsSplit = FALSE
    StaleGet = FALSE
    StaleRun = FALSE
    StaleList = FALSE
    MsStale = FALSE
    RunAfterAnswer = FALSE
    KeyInfo = FALSE
    MsOn = FALSE
    LagAfterCalm = 4
    DelayAfterCalm = 1
    SkewAfterCalm = 0
    MsEvict = FALSE
    Budgets = FALSE
    MaxBudget = 1
    BudgetAfterCalm = 0
    LifeAfterCalm = 0
    MaxExpiry = 9
    Bound = 1
    Holds = TRUE
    ReadTwo = FALSE
    HoldEnabled = TRUE
    HearsTwo = TRUE
SPECIFICATION Spec
INVARIANT ChainInTime
PROPERTY EnvTimeMoves
CHECK_DEADLOCK FALSE
