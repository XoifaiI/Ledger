\* Every MemoryStore action, clock and server action, with every MemoryStore fault, MsStale, MsEvict
\* with LifeAfterCalm 1,
\* LoseCommit, RunAfterAnswer, crashes, Shutdowns, clock jumps and clock steps on. LoseCommit acts
\* here only on MemoryStore, since no datastore call is sent. Clocks read within 1 tick of
\* true time before calm and exactly once calm, so Heal moves a clock. 1 server, no datastore calls, 2
\* MemoryStore calls with arguments 0, which throws on an item, and 2, and expiries 0, 1 and 2, where
\* 2 is past MaxExpiry 1 and errors, 1 tick, at most 2 faults, no bound
\* on lag or delay. MsSplit cuts the one server, so a second server that keeps MemoryStore is left out
\* here, and Shutdowns crashes the one server.
