\* The same as ProbeStamps.cfg with 2 calls and at most 2 faults, so two reverts, or a revert and a
\* failed call, fall in one behaviour. A revert may restore a version an earlier revert wrote. It
\* leaves out a third call beside them, which ProbeStamps.cfg drives with 1 fault. 1 server, 1 key,
\* stamps in 0..1, no skew, no bound on lag or delay. MemoryStore is off.
CONSTANTS
    Servers = {s1}
    Keys = {k1}
    MKeys = {m1}
    MaxReqs = 2
    MaxMsReqs = 0
    MaxTime = 1
    MaxSkew = 0
    MaxFaults = 2
    FailBefore = TRUE
    LoseAnswer = FALSE
    LoseCommit = FALSE
    LateLand = FALSE
    DsSplit = FALSE
    DsOutage = FALSE
    Reverts = TRUE
    Crashes = FALSE
    Shutdowns = FALSE
    ClockJumps = FALSE
    ClockSteps = FALSE
    MsFail = FALSE
    MsMaybe = FALSE
    MsVanish = FALSE
    MsOutage = FALSE
    MsSplit = FALSE
    StaleGet = TRUE
    StaleRun = FALSE
    StaleList = FALSE
    MsStale = FALSE
    RunAfterAnswer = FALSE
    KeyInfo = TRUE
    MsOn = FALSE
    LagAfterCalm = 2
    DelayAfterCalm = 2
    SkewAfterCalm = 0
    MsEvict = FALSE
    Budgets = FALSE
    MaxBudget = 1
    BudgetAfterCalm = 0
    LifeAfterCalm = 0
    MaxExpiry = 9
    Args = {1, 2}
    Lists = {}
    Again = FALSE
    Ttls = {1}
    Gets = TRUE
    Listers = {s1}
INIT Init
NEXT Next
INVARIANT EnvHolds
CHECK_DEADLOCK FALSE
