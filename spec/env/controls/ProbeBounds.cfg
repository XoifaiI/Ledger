\* The two bounds at 1 tick each, with StaleGet, StaleRun, MsStale, FailBefore, LoseCommit, LateLand and
\* RunAfterAnswer on. 1 server, 1 key, 1 MemoryStore key, 2 datastore calls and 1 MemoryStore call
\* with argument 1, a GetAsync among the datastore calls, 2 ticks, no skew, at most 1 fault. It checks
\* EnvDelay, which covers the answer and the read of a GetAsync, and the reads once calm. No listing:
\* ProbeBoundsList drives it, since a listing and MemoryStore do not meet in Env and their product
\* does not finish in 15 minutes.
