\* Stamps, the stamp a GetAsync reads, the missing stamp of a removal, reverts and notes, with
\* FailBefore and StaleGet on. 1 server, 1 key, 3 calls with arguments 1 and 2, stamps in 0..1, no
\* skew, at most 1 fault, no bound on lag or delay. A stamp belongs to a version and not to a
\* server, so one server is enough. Two servers with 3 calls did not finish in 600 seconds. With 3
\* calls and 2 faults a key reaches 5 versions, and that did not finish in 600 seconds either, so
\* this config leaves out a revert beside a second fault. ProbeStampsReverts.cfg drives two faults
\* with 2 calls. No listing and no cuts: ProbeKeys.cfg drives them. MemoryStore is off.
CONSTANTS
    Servers = {s1}
    Keys = {k1}
    MKeys = {m1}
    MaxReqs = 3
    MaxMsReqs = 0
    MaxTime = 1
    MaxSkew = 0
    MaxFaults = 1
    FailBefore = TRUE
    LoseAnswer = FALSE
    LoseCommit = FALSE
    LateLand = FALSE
    DsSplit = FALSE
    DsOutage = FALSE
    Reverts = TRUE
    Crashes = FALSE
    Shutdowns = FALSE
    ClockJumps = FALSE
    ClockSteps = FALSE
    MsFail = FALSE
    MsMaybe = FALSE
    MsVanish = FALSE
    MsOutage = FALSE
    MsSplit = FALSE
    StaleGet = TRUE
    StaleRun = FALSE
    StaleList = FALSE
    MsStale = FALSE
    RunAfterAnswer = FALSE
    KeyInfo = TRUE
    MsOn = FALSE
    LagAfterCalm = 2
    DelayAfterCalm = 2
    SkewAfterCalm = 0
    MsEvict = FALSE
    Budgets = FALSE
    MaxBudget = 1
    BudgetAfterCalm = 0
    LifeAfterCalm = 0
    MaxExpiry = 9
    Args = {1, 2}
    Lists = {}
    Again = FALSE
    Ttls = {1}
    Gets = TRUE
    Listers = {s1}
INIT Init
NEXT Next
INVARIANT EnvHolds
CHECK_DEADLOCK FALSE
