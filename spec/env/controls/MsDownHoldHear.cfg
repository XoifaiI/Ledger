\* MemoryStore down for the whole behaviour, no fault, DelayAfterCalm 4, which is no bound, and Hold
\* named as ENABLED of the step that hears the answer, which Env's rule forbids. The design expects
\* the error in 0 ticks. 1 server, 1 MemoryStore call, 3 ticks, no skew, no fault, no bound on lag.
\* Weak fairness, no symmetry.
