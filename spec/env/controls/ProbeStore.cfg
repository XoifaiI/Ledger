\* Every datastore and server action, with FailBefore, LoseAnswer, LoseCommit, LateLand, StaleGet,
\* StaleRun, RunAfterAnswer, crashes of one server and of every server, and retries that share a
\* closure. Argument 0 writes back what it read on a key that holds a value, and no run writes z.
\* A GetAsync is a call in steps. 2 servers, 1 key, 2 calls with arguments 0 and 1, 1 tick, no
\* skew, at most 2 faults, no bound on lag or delay. No listing, stamps, reverts or cuts:
\* ProbeKeys.cfg and ProbeStamps.cfg drive those. MemoryStore is off: ProbeMemory.cfg drives it.
\* ProbeBounds.cfg drives the bounds.
CONSTANTS
    Servers = {s1, s2}
    Keys = {k1}
    MKeys = {m1}
    MaxReqs = 2
    MaxMsReqs = 0
    MaxTime = 1
    MaxSkew = 0
    MaxFaults = 2
    FailBefore = TRUE
    LoseAnswer = TRUE
    LoseCommit = TRUE
    LateLand = TRUE
    DsSplit = FALSE
    DsOutage = FALSE
    Reverts = FALSE
    Crashes = TRUE
    Shutdowns = TRUE
    ClockJumps = FALSE
    ClockSteps = FALSE
    MsFail = FALSE
    MsMaybe = FALSE
    MsVanish = FALSE
    MsOutage = FALSE
    MsSplit = FALSE
    StaleGet = TRUE
    StaleRun = TRUE
    StaleList = FALSE
    MsStale = FALSE
    RunAfterAnswer = TRUE
    KeyInfo = FALSE
    MsOn = FALSE
    LagAfterCalm = 2
    DelayAfterCalm = 2
    SkewAfterCalm = 0
    MsEvict = FALSE
    Budgets = FALSE
    MaxBudget = 1
    BudgetAfterCalm = 0
    LifeAfterCalm = 0
    MaxExpiry = 9
    Args = {0, 1}
    Lists = {}
    Again = TRUE
    Ttls = {1}
    Gets = TRUE
    Listers = {s1, s2}
INIT Init
NEXT Next
INVARIANT EnvHolds
CHECK_DEADLOCK FALSE
