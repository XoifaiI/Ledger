\* No fault, and DelayAfterCalm 4, which is MaxTime + 1 and so no bound. Hold is on. It checks the answer alone.
\* 1 server, 1 key, 2 calls, 3 ticks, no skew, no fault, no bound on lag. Weak fairness, no symmetry.
\* EnvTimeMoves shows that time did not stop, so the checks over ticks are not empty.
