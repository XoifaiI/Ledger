    MsMaybe = FALSE
    MsVanish = FALSE
    MsOutage = FALSE
    MsSplit = FALSE
    MsEvict = FALSE
    StaleGet = TRUE
    StaleRun = TRUE
    StaleList = FALSE
    MsStale = FALSE
    RunAfterAnswer = TRUE
